---

on:  # yamllint disable-line rule:truthy
  pull_request: null
  push:
    branches:
      - master

name: Testing

permissions:
  contents: read

jobs:
  testo:
    uses: spiral/gh-actions/.github/workflows/testo.yml@master
    with:
      os: >-
        ['ubuntu-latest']
      # The application requires PHP 8.3+, and composer.lock is resolved for PHP 8.3–8.5.
      php: >-
        ['8.3', '8.4', '8.5']
      dependencies: >-
        ['locked']
